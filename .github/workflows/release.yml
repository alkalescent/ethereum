name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the version tag
    outputs:
      new_version: ${{ steps.version.outputs.new_tag }}
      tag_name: ${{ steps.version.outputs.new_tag }}
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Bump version and push tag
      id: version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: minor
        WITH_V: true
        TAG_CONTEXT: repo
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 0.1.0
    
    - name: Update version in pyproject.toml
      id: set-version
      run: |
        # Strip 'v' prefix for PyPI-compatible version
        PYPI_VERSION="${NEW_TAG#v}"
        sed -i "s/^version = .*/version = \"$PYPI_VERSION\"/" pyproject.toml
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"
        grep "^version" pyproject.toml
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    # Note: Version is injected locally for this job only.
    # Not committed to repo - downstream jobs inject version from tag.

  publish:
    name: Publish PyPI
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing to PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/staker
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Inject version from tag
      run: |
        PYPI_VERSION="${{ needs.version.outputs.new_version }}"
        PYPI_VERSION="${PYPI_VERSION#v}"  # Strip 'v' prefix
        sed -i "s/^version = .*/version = \"$PYPI_VERSION\"/" pyproject.toml
        echo "PyPI version: $PYPI_VERSION"
        grep "^version" pyproject.toml
    
    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      # Uses OIDC trusted publishing - configure at:
      # https://pypi.org/manage/account/publishing/

  release:
    name: Release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create the GitHub release
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: master
    
    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(needs.version.outputs.new_version, 'alpha') || contains(needs.version.outputs.new_version, 'beta') || contains(needs.version.outputs.new_version, 'rc') }}
